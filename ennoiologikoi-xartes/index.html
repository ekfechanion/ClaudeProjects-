/* ---------- Auto layout (layered, top-down) ---------- */
function layoutTargets() {
  const geo = new Map(doc.nodes.map(n => [n.id, nodeGeo(n)]));
  const out = new Map(), inn = new Map(), nb = new Map();
  doc.nodes.forEach(n => { out.set(n.id, []); inn.set(n.id, []); nb.set(n.id, []); });
  doc.links.forEach(l => {
    if (!out.has(l.from) || !out.has(l.to) || l.from === l.to) return;
    out.get(l.from).push(l.to); inn.get(l.to).push(l.from);
    nb.get(l.from).push(l.to); nb.get(l.to).push(l.from);
  });

  const level = new Map(), comps = [];
  const byScore = [...doc.nodes].sort((a, b) => score(b.id) - score(a.id) || a.y - b.y || a.x - b.x);
  for (const root of byScore) {
    if (level.has(root.id)) continue;
    const comp = [root.id]; level.set(root.id, 0);
    for (let i = 0; i < comp.length; i++) {
      const u = comp[i];
      const kids = [...out.get(u), ...nb.get(u)].filter((v, j, a) => a.indexOf(v) === j);
      kids.sort((a, b) => nodeById(a).x - nodeById(b).x);
      for (const v of kids) if (!level.has(v)) { level.set(v, level.get(u) + 1); comp.push(v); }
    }
    comps.push(comp);
  }
  const lblW = new Map();
  doc.links.forEach(l => {
    if (!l.label.trim() || !level.has(l.from) || !level.has(l.to)) return;
    const child = level.get(l.to) >= level.get(l.from) ? l.to : l.from;
    const lw = widest(wrap(l.label, LINK_FONT, 150), LINK_FONT) + 16;
    lblW.set(child, Math.max(lblW.get(child) || 0, lw));
  });

  const target = new Map();

    const idx = new Map();

      row.forEach((id, i) => idx.set(id, i));
    }
    const X = new Map();
    rows.forEach(row => { let x = 0; row.forEach((id, i) => { const w = W(id); if (i) x += w / 2; X.set(id, x); x += w / 2 + GAP; }); });
    const place = (row, refLevel) => {
      const desired = row.map(id => {
        const ns = nb.get(id).filter(v => level.get(v) === refLevel);
        return ns.length ? ns.reduce((s, v) => s + X.get(v), 0) / ns.length : X.get(id);
      });
      const pos = [];
      row.forEach((id, i) => {
        pos[i] = i ? Math.max(desired[i], pos[i - 1] + (W(row[i - 1]) + W(id)) / 2 + GAP) : desired[i];
      });
      const shift = row.reduce((s, id, i) => s + (desired[i] - pos[i]), 0) / row.length;
      row.forEach((id, i) => X.set(id, pos[i] + shift));
    };
    for (let it = 0; it < 3; it++) {
      for (let L = 1; L < rows.length; L++) place(rows[L], L - 1);
      for (let L = rows.length - 2; L >= 0; L--) place(rows[L], L + 1);
    }
    let minX = Infinity, maxX = -Infinity;
    comp.forEach(id => { const w = W(id); minX = Math.min(minX, X.get(id) - w / 2); maxX = Math.max(maxX, X.get(id) + w / 2); });
    let y = 0;
    rows.forEach((row, L) => {
      const hMax = Math.max(...row.map(id => geo.get(id).h));
      if (L) y += hMax / 2;

  const bends = new Map();

    const hits = doc.nodes.some(n => {
      if (n.id === l.from || n.id === l.to) return false;

}

function autoLayout() {

  doc.links.forEach(l => { l.bend = tgt.bends.get(l.id) || 0; });
  const from = new Map(doc.nodes.map(n => [n.id, { x: n.x, y: n.y }]));

    if (line.startsWith('?')) { d.focus = line.replace(/^\?\s*/, ''); continue; }
    const parts = line.split(/\s*(?:\||\t|->|→)\s*/).map(s => s.trim());
    const clean = parts.filter((p, i) => p || i === 1);

    } else if (clean.length === 2) {
      const a = node(clean[0]), b = node(clean[1]);
      if (a !== b) d.links.push({ id: uid('l'), from: a.id, to: b.id, label: '', dir: 'forward', bend: 0, blank: false });

}

/* ---------- Export ---------- */
function exportScene() {
  const { ops, bounds: b } = buildOps({ screen: false, pal: PAL_EXPORT, exercise, sel: new Set() });
  const PAD = 36, head = [], foot = [];
  const titleF = { size: 24, weight: 700, style: 'normal', lh: 30 }, focusF = { size: 15, weight: 500, style: 'italic', lh: 20 };
  const contentW = Math.max(b.w, 480);
  let y = PAD;
  if (doc.title.trim()) {
    const lines = wrap(doc.title.trim(), titleF, contentW, DISPLAY);
    head.push({ k: 'text', x: PAD, y: y + lines.length * titleF.lh / 2, lines, f: titleF, color: '#14201b', anchor: 'start', family: DISPLAY_SVG });
    y += lines.length * titleF.lh + 4;
  }
  if (doc.focus.trim()) {
    const lines = wrap(doc.focus.trim(), focusF, contentW, DISPLAY);
    head.push({ k: 'text', x: PAD, y: y + lines.length * focusF.lh / 2, lines, f: focusF, color: '#56655d', anchor: 'start', family: DISPLAY_SVG });
    y += lines.length * focusF.lh;
  }
  if (head.length) { head.push({ k: 'line', x1: PAD, y1: y + 10, x2: PAD + contentW, y2: y + 10, stroke: '#cbd5cc', sw: 1 }); y += 34; }
  const mapDX = PAD + (contentW - b.w) / 2 - b.x, mapDY = y - b.y;
  y += b.h + 10;
  if (exercise) {
    const words = hiddenWords();
    if (words.length) {
      y += 18;
      const hf = { size: 12, weight: 700, style: 'normal', lh: 14 }, wf = { size: 14, weight: 500, style: 'normal', lh: 18 };
      const top = y;
      foot.push({ k: 'text', x: PAD + 14, y: y + 16, lines: ['ΤΡΑΠΕΖΑ ΛΕΞΕΩΝ'], f: hf, color: '#2347b5', anchor: 'start' });
      let x = PAD + 14, rowY = y + 34;
      words.forEach(w => {
        const ww = measure(w, fontStr(wf)) + 18;
        if (x + ww > PAD + contentW - 14 && x > PAD + 14) { x = PAD + 14; rowY += 30; }
        foot.push({ k: 'rect', x, y: rowY, w: ww, h: 24, r: 5, fill: '#f3f6f2', stroke: '#cbd5cc', sw: 1 });
        foot.push({ k: 'text', x: x + 9, y: rowY + 12, lines: [w], f: wf, color: '#14201b', anchor: 'start' });
        x += ww + 8;
      });
      y = rowY + 24 + 12;
      foot.unshift({ k: 'rect', x: PAD, y: top, w: contentW, h: y - top, r: 8, fill: 'none', stroke: '#2347b5', sw: 1.4, dash: '5 4' });
    }
  }
  const W = Math.ceil(contentW + 2 * PAD), H = Math.ceil(y + PAD - 10);
  return { W, H, layers: [{ dx: 0, dy: 0, ops: head }, { dx: mapDX, dy: mapDY, ops }, { dx: 0, dy: 0, ops: foot }] };
}
function sceneToSVG(sc) {
  const body = sc.layers.map(L => `<g transform="translate(${r2(L.dx)} ${r2(L.dy)})">${opsToSVG(L.ops)}</g>`).join('');
  const t = esc(doc.title.trim() || 'Εννοιολογικός χάρτης');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${sc.W}" height="${sc.H}" viewBox="0 0 ${sc.W} ${sc.H}"><title>${t}</title><rect width="100%" height="100%" fill="#ffffff"/>${body}</svg>`;
}
function sceneToPNG(sc, scale = 2) {
  const c = document.createElement('canvas');
  c.width = sc.W * scale; c.height = sc.H * scale;
  const ctx = c.getContext('2d');
  ctx.scale(scale, scale); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, sc.W, sc.H);
  sc.layers.forEach(L => { ctx.save(); ctx.translate(L.dx, L.dy); opsToCanvas(ctx, L.ops); ctx.restore(); });
  return new Promise(res => c.toBlob(res, 'image/png'));
}
function baseName() {
  const t = (doc.title.trim() || 'εννοιολογικός χάρτης').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '-').slice(0, 60);
  return (t || 'xartis') + (exercise ? '-askisi' : '');
}
let downloadsNS;
async function getDownloads() {
  if (downloadsNS !== undefined) return downloadsNS;
  if (typeof window.claude?.use !== 'function') return (downloadsNS = null);
  try { downloadsNS = await window.claude.use('downloads'); } catch (e) { downloadsNS = null; }
  return downloadsNS;
}
async function saveFile(filename, data, mime, fallbackText) {
  if (!inViewer) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Αποθηκεύτηκε: ' + filename); return;
  }
  const dl = await getDownloads();
  if (dl) {
    try { const r = await dl.save({ filename, data }); if (r.status === 'saved') toast('Αποθηκεύτηκε: ' + filename); return; }
    catch (err) {
      if (err?.code === 'declined') { toast('Η αποθήκευση ακυρώθηκε.'); return; }
      if (err?.code === 'rate_limited') { toast('Ένα παράθυρο αποθήκευσης είναι ήδη ανοιχτό. Δοκίμασε ξανά σε λίγο.'); return; }
    }
  }
  if (fallbackText != null) showDialog({ title: 'Αντιγραφή περιεχομένου', text: 'Η λήψη αρχείων δεν είναι διαθέσιμη εδώ. Αντίγραψε το περιεχόμενο και αποθήκευσέ το σε αρχείο ' + filename.split('.').pop().toUpperCase() + '.', value: fallbackText, readOnly: true, copy: true });
  else toast('Η λήψη αρχείων δεν είναι διαθέσιμη εδώ. Άνοιξε το αρχείο index.html τοπικά.');
}
function saveJSON() {
  if (editing) commitEdit();
  const data = JSON.stringify({ app: 'ennoiologikoi-xartes', version: 1, ...doc }, null, 2);
  saveFile(baseName().replace(/-askisi$/, '') + '.json', data, 'application/json', data);
}
async function doExport(kind) {
  if (editing) commitEdit();
  if (kind === 'text') {
    showDialog({ title: 'Προτάσεις του χάρτη', text: 'Μία πρόταση ανά γραμμή: έννοια | λέξεις σύνδεσης | έννοια. Το ίδιο κείμενο ανοίγει ξανά ως χάρτης από «Νέος → Από κείμενο».', value: propsText(), readOnly: true, copy: true, download: 'txt' });
    return;
  }
  const sc = exportScene();
  if (kind === 'svg') { const s = sceneToSVG(sc); saveFile(baseName() + '.svg', s, 'image/svg+xml', s); }
  else if (kind === 'png') { const blob = await sceneToPNG(sc); if (blob) saveFile(baseName() + '.png', blob, 'image/png'); }
  else if (kind === 'print') {
    $('#printArea').innerHTML = sceneToSVG(sc).replace(/^<\?xml[^>]*>\s*/, '');
    setTimeout(() => window.print(), 50);
  }
}

/* ---------- Menus, dialog, toast ---------- */
function openMenu(menu, btn) {
  const was = !menu.hidden; closeMenus(); if (was) return;
  const r = btn.getBoundingClientRect();
  menu.hidden = false;
  const mw = menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + 'px';
  menu.style.top = (r.bottom + 6) + 'px';
  btn.setAttribute('aria-expanded', 'true');
  menu.querySelector('button')?.focus();
}
function closeMenus() { document.querySelectorAll('.menu').forEach(m => { m.hidden = true; }); document.querySelectorAll('[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu, [aria-haspopup]')) closeMenus(); });
$('#btnNew').addEventListener('click', e => openMenu($('#menuNew'), e.currentTarget));
$('#btnExport').addEventListener('click', e => openMenu($('#menuExport'), e.currentTarget));
$('#menuNew').addEventListener('click', e => {
  const b = e.target.closest('[data-new]'); if (!b) return; closeMenus();
  const k = b.dataset.new;
  if (k === 'text') { openTextImport(); return; }
  loadDoc(EXAMPLES[k](), { layout: k !== 'blank' });
  if (k === 'blank') { const n = doc.nodes[0]; sel = new Set([n.id]); render(); renderPanel(); }
  toast(k === 'blank' ? 'Νέος χάρτης. Με «Αναίρεση» επιστρέφεις στον προηγούμενο.' : 'Φορτώθηκε το παράδειγμα. Με «Αναίρεση» επιστρέφεις στον προηγούμενο χάρτη.');
});
$('#menuExport').addEventListener('click', e => { const b = e.target.closest('[data-exp]'); if (!b) return; closeMenus(); doExport(b.dataset.exp); });
if (inViewer) $('#expPrint').remove();

let dlgHandlers = [];
function showDialog({ title, text, value = '', readOnly = false, copy = false, download = null, actions = [] }) {
  $('#dlgTitle').textContent = title; $('#dlgText').textContent = text;
  const area = $('#dlgArea'); area.value = value; area.readOnly = readOnly; area.placeholder = '';
  const bar = $('#dlgButtons'); bar.innerHTML = ''; dlgHandlers = [];
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label; b.addEventListener('click', fn); bar.appendChild(b); return b; };
  add(actions.length ? 'Άκυρο' : 'Κλείσιμο', '', closeDialog);
  if (download) add('Λήψη .' + download, '', () => saveFile(baseName().replace(/-askisi$/, '') + '.' + download, area.value, 'text/plain', null));
  if (copy) add('Αντιγραφή', 'accent', async () => {
    try { await navigator.clipboard.writeText(area.value); toast('Αντιγράφηκε.'); }
    catch (e) { area.focus(); area.select(); try { document.execCommand('copy'); toast('Αντιγράφηκε.'); } catch (e2) { toast('Επίλεξε το κείμενο και πάτησε Ctrl+C.'); } }
  });
  actions.forEach(a => add(a.label, 'accent', () => a.run(area.value)));
  $('#scrim').hidden = false;
  setTimeout(() => (readOnly ? bar.lastElementChild : area).focus(), 30);
  return area;
}
function closeDialog() { $('#scrim').hidden = true; svg.focus({ preventScroll: true }); }
$('#scrim').addEventListener('pointerdown', e => { if (e.target === $('#scrim')) closeDialog(); });
function openTextImport() {
  const area = showDialog({
    title: 'Χάρτης από κείμενο',
    text: 'Μία πρόταση ανά γραμμή: έννοια | λέξεις σύνδεσης | έννοια. Γραμμή με # γίνεται τίτλος, με ? ερώτηση εστίασης. Οι ίδιες έννοιες ενώνονται αυτόματα.',
    value: '', actions: [{ label: 'Δημιουργία χάρτη', run: v => {
      const d = parseProps(v);
      if (!d.nodes.length) { toast('Γράψε τουλάχιστον μία έννοια.'); return; }
      closeDialog(); loadDoc(d, { layout: true });
      toast(`Δημιουργήθηκαν ${d.nodes.length} έννοιες και ${d.links.length} συνδέσεις.`);
    } }]
  });
  area.placeholder = '# Φωτοσύνθεση\n? Πώς τρέφονται τα φυτά;\nΦωτοσύνθεση | γίνεται στους | Χλωροπλάστες\nΦωτοσύνθεση | χρειάζεται | Φως\nΦωτοσύνθεση | παράγει | Γλυκόζη\nΦωτοσύνθεση | απελευθερώνει | Οξυγόνο';
}
let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------- Open files ---------- */
async function openFile(file) {
  try {
    const text = await file.text();
    let d;
    try { d = normalizeDoc(JSON.parse(text)); loadDoc(d); }
    catch (e) {
      if (/\.json$/i.test(file.name)) throw e;
      d = parseProps(text); if (!d.nodes.length) throw new Error('empty'); loadDoc(d, { layout: true });
    }
    toast('Άνοιξε: ' + file.name);
  } catch (e) { toast('Δεν ήταν δυνατό να ανοίξει το αρχείο. Χρειάζεται .json από αυτή την εφαρμογή ή κείμενο προτάσεων.'); }
}
$('#btnOpen').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
document.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); document.body.classList.add('dropping'); } });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
document.addEventListener('drop', e => { document.body.classList.remove('dropping'); const f = e.dataTransfer?.files?.[0]; if (f) { e.preventDefault(); openFile(f); } });

/* ---------- Toolbar ---------- */
$('#btnSave').addEventListener('click', saveJSON);
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);
$('#btnLayout').addEventListener('click', autoLayout);
$('#btnFit').addEventListener('click', () => fitView(true));
$('#btnAdd').addEventListener('click', () => {
  const s = stageSize(); let w = toWorld(s.left + s.w / 2, s.top + s.h / 2);
  for (let i = 0; i < 12 && overlaps(w.x, w.y, 130, 40); i++) w = { x: w.x + 30, y: w.y + 50 };
  checkpoint(); const n = addNode(w.x, w.y); sel = new Set([n.id]); changed(true);
  startEdit('node', n.id, { isNew: true, noCheckpoint: true });
});
$('#btnExercise').addEventListener('click', e => {
  if (editing) commitEdit();
  exercise = !exercise; e.currentTarget.setAttribute('aria-pressed', String(exercise));
  changed(false);
  if (exercise && !hiddenWords().length) toast('Δεν υπάρχουν κενά ακόμη. Επίλεξε έννοιες ή συνδέσεις και σημείωσε «Κενό στην άσκηση».');
});
$('#zoomIn').addEventListener('click', () => { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, 1.2); });
$('#zoomOut').addEventListener('click', () => { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, 1 / 1.2); });
$('#zoomPct').addEventListener('click', () => { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, 1 / view.k); });

/* ---------- Theme changes ---------- */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { render(); renderPanel(); });
new MutationObserver(() => { render(); renderPanel(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(() => { if (editing) positionEditor(); }).observe(stage);

/* ---------- Boot ---------- */
window.claude?.hot?.snapshot?.(() => ({ doc, view, exercise }));
function start(data) {
  const fontsReady = document.fonts?.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  fontsReady.then(() => {
    mcache.clear();
    let saved = data && data.doc ? data : null;
    if (!saved) { try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; } }
    let fit = true;
    if (saved && saved.doc) {
      try {
        doc = normalizeDoc(saved.doc);
        if (saved.view && Number.isFinite(saved.view.k)) { view = { x: +saved.view.x || 0, y: +saved.view.y || 0, k: clampK(+saved.view.k) }; fit = false; }
        exercise = !!saved.exercise;
      } catch (e) { saved = null; }
    }
    if (!saved) {
      doc = EXAMPLES.energy();
      applyLayout();
      fit = true;
    }
    $('#btnExercise').setAttribute('aria-pressed', String(exercise));
    syncMapFields(); renderNow(); renderPanel(); updateUndoUI();
    if (fit) fitView(false);
    getDownloads();
  });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
